<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-label="정산 흐름: 구매확정, 정산 생성, 자동 확정, 토스 지급대행, 웹훅과 폴링으로 지급 결과 확정. 산식은 SettlementCalculator 한 클래스에 있고, 지급대행은 수취자 1명당 요청 1건이다. 정산 생성 뒤 환불은 각자의 다음 정산에서 차감한다.">
  <defs>
    <style>
      .t { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; }
      .m { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'D2Coding', monospace; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8F96A3"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="272" rx="16" fill="#F5F4F0"/>
  <g class="t">
    <!-- pipeline -->
    <g text-anchor="middle">
      <rect x="24" y="28" width="160" height="64" rx="10" fill="#FCFCFA" stroke="#DEDCD6" stroke-width="1.5"/>
      <text x="104" y="56" font-size="12" font-weight="700" fill="#2B5AD5">01</text>
      <text x="104" y="77" font-size="15" font-weight="700" fill="#1E2430">구매확정</text>

      <rect x="212" y="28" width="160" height="64" rx="10" fill="#FCFCFA" stroke="#2B5AD5" stroke-width="1.5"/>
      <text x="292" y="56" font-size="12" font-weight="700" fill="#2B5AD5">02</text>
      <text x="292" y="77" font-size="15" font-weight="700" fill="#1E2430">정산 생성</text>

      <rect x="400" y="28" width="160" height="64" rx="10" fill="#FCFCFA" stroke="#DEDCD6" stroke-width="1.5"/>
      <text x="480" y="56" font-size="12" font-weight="700" fill="#2B5AD5">03</text>
      <text x="480" y="77" font-size="15" font-weight="700" fill="#1E2430">자동 확정</text>

      <rect x="588" y="28" width="160" height="64" rx="10" fill="#FCFCFA" stroke="#2B5AD5" stroke-width="1.5"/>
      <text x="668" y="56" font-size="12" font-weight="700" fill="#2B5AD5">04</text>
      <text x="668" y="77" font-size="15" font-weight="700" fill="#1E2430">토스 지급대행</text>

      <rect x="776" y="28" width="160" height="64" rx="10" fill="#1E2430"/>
      <text x="856" y="56" font-size="12" font-weight="700" fill="#8EB2FE">05</text>
      <text x="856" y="77" font-size="15" font-weight="700" fill="#F5F4F0">지급 결과 확정</text>
    </g>
    <g stroke="#8F96A3" stroke-width="1.6" fill="none">
      <path d="M186 60 H208" marker-end="url(#ah)"/>
      <path d="M374 60 H396" marker-end="url(#ah)"/>
      <path d="M562 60 H584" marker-end="url(#ah)"/>
      <path d="M750 60 H772" marker-end="url(#ah)"/>
    </g>

    <!-- notes -->
    <g stroke="#2B5AD5" stroke-width="1.4" stroke-dasharray="3 3" fill="none">
      <path d="M292 92 V120"/>
      <path d="M668 92 V120"/>
      <path d="M856 92 V120"/>
    </g>
    <rect x="192" y="120" width="200" height="66" rx="10" fill="#EEF2FB" stroke="#C9D6F2" stroke-width="1.2"/>
    <text x="208" y="143" font-size="13.5" font-weight="700" fill="#1E2430">산식은 한 클래스에서</text>
    <text x="208" y="163" class="m" font-size="12" fill="#2B5AD5">SettlementCalculator</text>
    <text x="208" y="179" font-size="11.5" fill="#4A4E54">정산 · 성과 · 조정 미리보기 공통</text>

    <rect x="568" y="120" width="186" height="66" rx="10" fill="#EEF2FB" stroke="#C9D6F2" stroke-width="1.2"/>
    <text x="584" y="143" font-size="13.5" font-weight="700" fill="#1E2430">지급대행은 건별로</text>
    <text x="584" y="163" font-size="12" fill="#4A4E54">수취자 1명 = 요청 1건</text>
    <text x="584" y="179" class="m" font-size="11.5" fill="#2B5AD5">JWE · A256GCM</text>

    <rect x="764" y="120" width="172" height="66" rx="10" fill="#EEF2FB" stroke="#C9D6F2" stroke-width="1.2"/>
    <text x="780" y="143" font-size="13.5" font-weight="700" fill="#1E2430">결과는 따로 확정</text>
    <text x="780" y="163" font-size="12" fill="#4A4E54">웹훅 · 폴링</text>
    <text x="780" y="179" font-size="11.5" fill="#4A4E54">같은 멱등 키로 재시도</text>

    <!-- refund lane -->
    <rect x="24" y="206" width="912" height="44" rx="10" fill="#FBEDE4" stroke="#F0C9AE" stroke-width="1.2"/>
    <text x="44" y="233" font-size="13.5" font-weight="700" fill="#B85A24">환불이 생기면</text>
    <text x="150" y="233" font-size="13" fill="#4A4E54">이미 만든 정산은 고치지 않고(스냅샷), 브랜드와 인플루언서 각자의 다음 정산에서 따로 차감</text>
  </g>
</svg>
