spring:
  application:
    name: showroomz	
  config:
    import: optional:file:.env[.properties]  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local} # 환경변수가 없으면 local 기본값
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true  # SQL 쿼리를 보기 좋게 줄 바꿈하여 정렬합니다.
        use_sql_comments: true # JPQL 쿼리 내용을 주석으로 함께 표시해줍니다.
  
  # Jackson 설정 - 모든 API 응답의 시간 형식 통일 (ISO 8601 UTC: 2026-01-19T12:54:03Z)
  jackson:
    serialization:
      write-dates-as-timestamps: false  # 날짜를 타임스탬프가 아닌 문자열로 직렬화
    time-zone: UTC  # UTC 시간대 사용
    
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}  # Gmail 주소 (예: showroomz.admin@gmail.com)
    password: ${MAIL_PASSWORD:} # Gmail 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
app:
  base-url: ${APP_BASE_URL:https://showroomz.shop}  # 마켓 URL 생성에 사용되는 기본 도메인
  auth:
    # JWT 시크릿 키 (32자 이상 권장, 임의의 긴 문자열 사용)
    tokenSecret: ${TOKEN_SECRET}
    tokenExpiry: 1800000      # 액세스 토큰 만료 시간 (30분, 밀리초 단위)
    refreshTokenExpiry: 604800000 # 리프레시 토큰 만료 시간 (7일)

# JwtConfig.java 관련 설정 
jwt:
  secret: ${TOKEN_SECRET}

# CorsProperties.java 관련 설정
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://api.showroomz.shop,https://api.showroomz.shop,http://54.180.85.237:8080,https://54.180.85.237:8080,https://front-end-partners-one.vercel.app,https://front-end-admin-seven-brown.vercel.app,https://admin.showroomz.shop,https://seller.showroomz.shop,https://front-end-studio-one.vercel.app
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: '*'
  max-age: 3600

# GeoLocationService.java 관련 설정 — mmdb를 jar에 번들하지 않고 파일 경로에서 읽는다
geoip:
  db-path: ${GEOIP_DB_PATH:/geoip/GeoLite2-City.mmdb}

# S3Properties.java 관련 설정
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    cloud-front-domain: ${AWS_CLOUDFRONT_DOMAIN:}


# FcmProperties.java 관련 설정 — 팔로워 신규 게시물 알림 등 푸시 발송
# 서비스 계정 JSON은 저장소에 넣지 않는다. 둘 다 비어 있으면 발송하지 않고 로그만 남는다(기동은 정상).
fcm:
  enabled: ${FCM_ENABLED:true}
  credentials-path: ${FCM_CREDENTIALS_PATH:}     # 예) file:/etc/showroomz/fcm-service-account.json
  credentials-base64: ${FCM_CREDENTIALS_BASE64:} # 서비스 계정 JSON을 base64로 인코딩한 값 (path보다 우선)
  dry-run: ${FCM_DRY_RUN:false}                  # true면 FCM 검증만 하고 기기로는 보내지 않는다

springdoc:
  swagger-ui:
    tags-sorter: alpha       # 태그를 알파벳순 정렬
    operations-sorter: alpha # API(메서드)도 알파벳순 정렬
    doc-expansion: none      # 문서 기본 접힘 상태 (none | list | full)
    try-it-out-enabled: true # Try it out 기본 활성화
    filter: true             # API 검색/필터링 창 표시

# PostProperties.java 관련 설정 — §24 게시물 운영 정책값
# 전부 법률 자문 대기 중인 "가정값"이라 코드가 아니라 설정으로 둔다(§24-8).
# 보관 기간류는 짧게 잡았다가 늘릴 수 없으므로, 미확정 구간의 기본값은 "지우지 않는 쪽"이다.
post:
  appeal-deadline-days: ${POST_APPEAL_DEADLINE_DAYS:7}          # 이의 신청 기한 (시안 7일)
  appeal-review-business-days: ${POST_APPEAL_REVIEW_DAYS:3}     # 심사 예상 소요 — 표시용
  download-grace-days: ${POST_DOWNLOAD_GRACE_DAYS:30}           # 반려 후 원본 내려받기 유예
  retention-months: ${POST_RETENTION_MONTHS:6}                  # 삭제 게시물 비공개 보관 기간
  purge-enabled: ${POST_PURGE_ENABLED:false}                    # 파기 배치 — 기본은 드라이런
  purge-batch-size: ${POST_PURGE_BATCH_SIZE:100}
  impression-retention-days: ${POST_IMPRESSION_RETENTION_DAYS:0} # 0이면 노출 로그를 삭제하지 않는다

# PortOneProperties.java 관련 설정 — 결제 연동(포트원 V2 · 토스페이먼츠 신모듈, 결제 계획서 6-2)
# enabled=false 면 FakePaymentGateway 가 붙는다(자격 없는 로컬·CI). 그때는 나머지 값이 비어 있어도 기동한다.
portone:
  enabled: ${PORTONE_ENABLED:true}
  store-id: ${PORTONE_STORE_ID:}
  api-secret: ${PORTONE_API_SECRET:}                # V2 API Secret — Authorization: PortOne {secret}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}        # 콘솔 웹훅 설정의 시크릿(whsec_…)
  channel-keys:                                     # 토스페이먼츠 허브형이라 지금은 네 값이 같은 키다(2-2). "-" 는 명시적으로 끈 채널
    card: ${PORTONE_CHANNEL_CARD:}
    kakaopay: ${PORTONE_CHANNEL_KAKAOPAY:}          # 비워 두면 카드 채널을 따라간다
    naverpay: ${PORTONE_CHANNEL_NAVERPAY:}
    tosspay: ${PORTONE_CHANNEL_TOSSPAY:}

# OrderProperties.java 관련 설정 — 주문·결제 운영값(결제 계획서 4-4 · 4-8 · 6-2)
order:
  payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
  expiration-scheduler-enabled: true
  expiry-deferral-minutes: 5                        # 포트원 PENDING 이면 만료를 미룬다 — 최대 3회
  expiry-max-deferrals: 3
  expiry-max-check-failures: 3
  cancel-retry-base-minutes: 2                      # 취소 수렴 첫 재시도 간격 — 2·4·8·16·32분
  cancel-retry-max-attempts: 5                      # 도달 시 CANCEL_FAILED
  reconciliation-enabled: true                      # 일일 대사 05:00 KST
  health-check-enabled: true                        # 운영 지표 10분 주기
  customer-email-enabled: true                      # 포트원 customer 블록에 이메일 포함 여부(9-1 ②)
  purchase-confirm-days: 7                          # 구매확정 — 배송완료 + N일 자동(약관 제19조①)
  purchase-confirm-scheduler-enabled: true          # 구매확정 배치(매시)
  search-range-max-days: 365                        # 파트너센터 주문 조회 기간 상한(§34-2)
  shipment-upload-max-rows: 1000                    # 송장 엑셀 일괄 업로드 행 상한(§34-5)
  user-list-months: 6                               # 앱 주문 내역 조회 범위 — 최근 N개월(C10)
  user-list-page-size-max: 50                       # 앱 주문 내역 페이지 크기 상한
  arrival-default-days: 3                           # 도착 예정 — 집화일 + N배송일(일요일·공휴일 제외)
  arrival-stats-window-days: 90                     # 택배사별 실제 소요일 평균의 표본 범위
  arrival-stats-min-samples: 30                     # 표본이 이보다 적은 택배사는 기본값
  arrival-stats-refresh-hours: 6                    # 평균 재집계 주기
  claim:                                            # 반품·교환(35 설계서 · 앱 클레임 설계서) — 기한·횟수는 미결이 많아 전부 설정값
    collect-due-business-days: 2                    # 기한 ① 회수 대기 방치 — 신청 + N영업일(「지연」 표시)
    inspect-due-business-days: 2                    # 기한 ② 검수 완료 — 입고 확인 + N영업일
    inspect-due-basis: RECEIVED                     # 기한 ②의 기산점 — RECEIVED(입고 확인) | ARRIVED(추적상 도착)
    invoice-due-days: 7                             # 회수 송장 등록 기한 — 지나면 요청 자동 취소
    reship-pay-due-days: 14                         # 반려 상품 재발송비 결제 기한 — 지나면 미결제 고지 시작
    payment-pending-minutes: 30                     # 교환 재발송비 결제 대기 — 지나면 요청 초안 삭제
    storage-required-notices: 2                     # 보관 기한이 생기는 최소 고지 횟수
    storage-months: 3                               # 보관 기간 — 최종 고지일 + N개월
    evidence-max: 5                                 # 검수 거절 증빙 사진 상한
    receive-before-arrival: true                    # 추적상 도착 전에도 입고 확인 허용 — 택배 추적이 꺼져 있는 동안의 출구
    invoice-expiry-scheduler-enabled: true          # 회수 송장 미등록 자동 취소 배치

# DeliveryTrackerProperties.java — 배송 추적 연동(34 설계서 3-3). enabled=false 면 Noop 스텁이 붙고
# 감시 배치가 멈춘다(송장 형식 검증도 생략 기록). true 면 스마트택배 조회 API 어댑터가 붙는다(택배 추적 설계서) — 런칭 게이트.
delivery:
  tracker:
    enabled: ${DELIVERY_TRACKER_ENABLED:false}
    poll-cron: "0 0 0,6-22/2 * * *"                 # KST · 02~06시 제외 2시간 간격 — 하루 10회(FREE 송장당 일 한도)
    batch-size: 300                                 # 페이지 크기 — 한 회차에 대상 전량을 이 크기로 나눠 돈다
    call-gap-ms: 100                                # 건 사이 호출 간격
    pickup-alert-hours: 24                          # 집화 확인 필요 — 송장 등록 후 N시간 추적 미조회
    stall-alert-days: 7                             # 추적 정지 — 마지막 이벤트 후 N일 갱신 없음
    api-url: https://info.sweettracker.co.kr
    api-key: ${DELIVERY_TRACKER_API_KEY:}           # enabled=true 인데 비어 있으면 기동 실패
    validation-enabled: false                       # 송장 형식 검증 — 에러 104 판정을 택배사별로 확인한 뒤 켠다
    usage-alert-ratio: 0.2                          # 이용권 잔여 사용량 경고 기준

# Sentry 설정 (공통)
sentry:
  dsn: ${SENTRY_DSN:https://default-dsn-address@sentry.io/0} # Sentry에서 발급받은 DSN을 환경 변수에서 읽어옴
  exception-resolver-order: -2147483647 # Sentry 예외 처리 순서를 가장 높게 설정
  logging:
    minimum-event-level: error # log.error() 이상은 무조건 Sentry로 보냄
    minimum-breadcrumb-level: info # log.info()는 Sentry 이슈 내의 '타임라인(Breadcrumb)'에 기록으로 남김

